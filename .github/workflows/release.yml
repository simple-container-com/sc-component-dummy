name: Release

# Cuts cross-platform PLUGIN binaries + sha256sums for every release.
# Service image is NOT pushed from this workflow — see root CLAUDE.md
# "no Dockerhub publish without operator yes". The service image is
# built locally at smoke time (`make docker` in service/) or via a
# local `docker build` on the target VPS.
#
# Two triggers:
#   - push to main → auto-release with CalVer "vYYYY.MM.DD-<short-sha>".
#   - manually-pushed "v*" tag → named release for pinning / rollback.
#
# Both paths produce the same artifact set: three PLUGIN binaries
# (linux/amd64, linux/arm64, darwin/arm64), a sha256sums.txt, and a
# GitHub Release.
#
# OOM pins (GOMAXPROCS=1, GOMEMLIMIT=6GiB, `go build -p 1`) — kept
# verbatim from sc-plugin-echo even though sc-component-dummy's plugin
# imports no large Pulumi SDK today. Four of six existing SC plugin
# repos learned this lesson the hard way; a derived component plugin
# that adds a cloud SDK later will need these pins and the workflow
# shouldn't gate on knowing in advance.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_tag:  ${{ steps.compute.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        name: Resolve version string
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true"               >> "$GITHUB_OUTPUT"
          else
            ver="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
            echo "version=${ver}"            >> "$GITHUB_OUTPUT"
            echo "is_tag=false"              >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugin/go.sum

      - name: Build plugin binary
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
          # OOM-safe pins — see workflow file-level comment.
          GOMAXPROCS: '1'
          GOMEMLIMIT: '6GiB'
        run: |
          out=sc-component-dummy-${GOOS}-${GOARCH}
          go build -trimpath -buildvcs=false -p 1 \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../${out}" \
            ./cmd/sc-plugin-dummy
          sha256sum "../${out}" > "../${out}.sha256"
          tar -czf "../${out}.tar.gz" "../${out}"
          sha256sum "../${out}.tar.gz" >> "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sc-component-dummy-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build consolidated sha256sums.txt
        working-directory: dist
        run: |
          cat sc-component-dummy-*.sha256 > sha256sums.txt
          rm sc-component-dummy-*.sha256
          cat sha256sums.txt

      - name: Tag commit if from main
        if: needs.version.outputs.is_tag == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*

# NOTE — no Dockerhub push step.
#
# The sc-component-dummy service image is NOT published from this
# repo's CI. Per fleet CLAUDE.md "package publishing, registries or
# release pipelines" — publishing into the shared simplecontainer/*
# namespace needs explicit operator yes. The service image is built
# locally at smoke time (service/Makefile's `make docker` target) and
# loaded onto the target VPS via `docker save` + `scp` + `docker load`
# OR built on the host from a `git clone` of this repo.
#
# When/if the operator approves a Dockerhub publish for this repo, a
# second workflow (`push-image.yml`) will add the push step. Keeping
# it out of this release workflow means plugin-binary releases cut
# cleanly without a cross-concern on the Docker Hub path.
